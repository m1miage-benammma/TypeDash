[build]
  base = "frontend"
  # GitHub Actions publishes the Docker-built artifact after Render succeeds.
  ignore = "exit 0"
  command = "echo 'Publish the Docker-built artifact through GitHub Actions.' >&2; exit 1"
  publish = "dist/frontend/browser"

# /api rewrites are generated at build time from TYPEDASH_API_ORIGIN.
# Static prerendered pages take precedence over the non-forced SPA fallback.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
# The build emits CSP into _headers with hashes of the actual prerendered scripts.
# Proxied /api responses receive their security headers in FastAPI.
