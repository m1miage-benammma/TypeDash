name: Deploy production
on:
  workflow_dispatch:
run-name: "TypeDash production — ${{ github.sha }}"
env:
  TYPEDASH_API_ORIGIN: https://typedash-gkbn.onrender.com
  TYPEDASH_SITE_ORIGIN: https://typedash.online
permissions:
  contents: read
concurrency:
  group: typedash-production
  cancel-in-progress: false
jobs:
  verify:
    name: Verify Docker production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only allow production from main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Select main when running Deploy production."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment configuration in Docker
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          docker run --rm \
            -e RENDER_API_KEY -e RENDER_SERVICE_ID -e NETLIFY_AUTH_TOKEN -e NETLIFY_SITE_ID \
            -e TYPEDASH_API_ORIGIN -e TYPEDASH_SITE_ORIGIN \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" \
            python:3.12-alpine python /scripts/check-deployment-config.py
      - name: Check Netlify project access in Docker
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          docker run --rm -e NETLIFY_AUTH_TOKEN -e NETLIFY_SITE_ID \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" \
            python:3.12-alpine python /scripts/check-netlify-access.py
      - name: Build production images
        run: docker compose -f docker-compose.ci.yml build backend frontend
      - name: Export verified frontend
        run: |
          docker build --target artifact --build-arg TYPEDASH_API_ORIGIN \
            --output type=local,dest=frontend/dist/frontend/browser ./frontend
      - name: Block publication if a deployment secret is present in public files
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          docker run --rm -e RENDER_API_KEY -e RENDER_SERVICE_ID -e NETLIFY_AUTH_TOKEN -e NETLIFY_SITE_ID \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" \
            -v "$GITHUB_WORKSPACE/frontend/dist/frontend/browser:/published:ro" \
            python:3.12-alpine python /scripts/check-public-artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-frontend-${{ github.sha }}
          path: frontend/dist/frontend/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Build summary
        run: echo "Docker production builds passed. No automated tests were run." >> "$GITHUB_STEP_SUMMARY"
  deploy_backend:
    name: Deploy backend and wait for Render
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy exact commit and wait for live status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          docker run --rm -e RENDER_API_KEY -e RENDER_SERVICE_ID \
            -e TYPEDASH_API_ORIGIN -e DEPLOY_COMMIT \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" \
            python:3.12-alpine python /scripts/deploy-render.py
  deploy_frontend:
    name: Publish verified frontend to Netlify
    needs: [verify, deploy_backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: production-frontend-${{ github.sha }}
          path: published
      - name: Build Netlify CLI container
        run: docker build -f .github/docker/netlify.Dockerfile -t typedash-netlify:deploy .github/docker
      - name: Publish production without rebuilding
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          RELEASE_COMMIT: ${{ github.sha }}
          CI: "true"
        run: |
          docker run --rm -e NETLIFY_AUTH_TOKEN -e NETLIFY_SITE_ID -e CI \
            -v "$GITHUB_WORKSPACE/published:/published:ro" \
            typedash-netlify:deploy deploy --prod --no-build \
            --site "$NETLIFY_SITE_ID" --dir /published \
            --message "TypeDash production $RELEASE_COMMIT"
