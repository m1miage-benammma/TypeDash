name: Docker production builds
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production images with Docker
        run: docker compose -f docker-compose.ci.yml build backend frontend
