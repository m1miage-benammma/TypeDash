# Local development with persistent PostgreSQL and hot reload.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [typedash]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    env_file: [./.env]
    environment:
      TYPEDASH_RUNTIME_ENVIRONMENT: development
      TYPEDASH_STORAGE: postgres
      TYPEDASH_DATABASE_URL: ""
      TYPEDASH_DB_HOST: postgres
      TYPEDASH_DB_PORT: "5432"
      TYPEDASH_DB_SSL_MODE: disable
      TYPEDASH_REDIS_URL: redis://redis:6379/0
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [typedash]
    restart: unless-stopped

  postgres:
    # Keep version 16 to preserve existing local data. Upgrade separately with a backup.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${TYPEDASH_DB_NAME:?Set TYPEDASH_DB_NAME in .env}"
      POSTGRES_USER: "${TYPEDASH_DB_USERNAME:?Set TYPEDASH_DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${TYPEDASH_DB_PASSWORD:?Set TYPEDASH_DB_PASSWORD in .env}"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [typedash]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [typedash]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

networks:
  typedash:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
