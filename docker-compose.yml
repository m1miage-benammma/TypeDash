services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      TYPEDASH_DB_HOST: postgres
      TYPEDASH_DB_PORT: 5432
      TYPEDASH_STORAGE: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TYPEDASH_DB_NAME}
      POSTGRES_USER: ${TYPEDASH_DB_USERNAME}
      POSTGRES_PASSWORD: ${TYPEDASH_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
