<section class="mx-auto mt-12 max-w-[900px] rounded-2xl border border-[var(--line)] bg-[var(--surface)] p-7 shadow-[var(--shadow)] max-[600px]:p-5" [attr.aria-label]="t('calculator')">
  <div class="grid grid-cols-3 gap-4 max-[650px]:grid-cols-1">
    <label class="grid gap-2 text-xs font-semibold text-[var(--muted)]">
      {{ t('typedCharacters') }}
      <input class="rounded-lg border border-[var(--line)] bg-[var(--surface-soft)] px-3 py-3 text-base text-[var(--ink)] outline-none focus:border-[var(--accent)]"
        type="text" inputmode="decimal" [value]="characters()" (input)="setCharacters($event)" />
    </label>
    <label class="grid gap-2 text-xs font-semibold text-[var(--muted)]">
      {{ t('elapsedSeconds') }}
      <input class="rounded-lg border border-[var(--line)] bg-[var(--surface-soft)] px-3 py-3 text-base text-[var(--ink)] outline-none focus:border-[var(--accent)]"
        type="text" inputmode="decimal" [value]="seconds()" (input)="setSeconds($event)" />
    </label>
    <label class="grid gap-2 text-xs font-semibold text-[var(--muted)]">
      {{ t('typingErrors') }}
      <input class="rounded-lg border border-[var(--line)] bg-[var(--surface-soft)] px-3 py-3 text-base text-[var(--ink)] outline-none focus:border-[var(--accent)]"
        type="text" inputmode="decimal" [value]="errors()" (input)="setErrors($event)" />
    </label>
  </div>
  @if (failed()) { <p class="mt-4 text-sm text-red-500" role="alert">{{ t('loadFailed') }}</p> }
  <div class="mt-6 grid grid-cols-3 gap-3 max-[650px]:grid-cols-1">
    <div class="rounded-xl bg-[var(--surface-soft)] p-4"><span class="text-[10px] font-bold tracking-wide text-[var(--muted)]">{{ t('grossWpm') }}</span><strong class="mt-2 block text-3xl">{{ grossWpm() | number:'1.0-1' }}</strong></div>
    <div class="rounded-xl bg-[var(--brand-tint)] p-4"><span class="text-[10px] font-bold tracking-wide text-[var(--muted)]">{{ t('adjustedWpm') }}</span><strong class="mt-2 block text-3xl text-[var(--brand-text)]">{{ adjustedWpm() | number:'1.0-1' }}</strong></div>
    <div class="rounded-xl bg-[var(--accent-tint)] p-4"><span class="text-[10px] font-bold tracking-wide text-[var(--muted)]">{{ t('accuracy') }}</span><strong class="mt-2 block text-3xl">{{ calculatedAccuracy() | number:'1.0-1' }}%</strong></div>
  </div>
</section>
