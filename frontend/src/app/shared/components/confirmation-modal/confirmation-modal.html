<td-dialog [label]="title()" [dismissible]="!busy()" (dismissed)="cancelled.emit()">
  <div class="text-center">
    <span class="inline-grid size-11 place-items-center rounded-full bg-[var(--accent-tint)] text-[21px] text-[var(--accent)]"><td-icon name="reset" /></span>
    <h2 class="mt-4 mb-2 text-[21px] font-semibold">{{ title() }}</h2>
    <p class="m-0 text-[13px] leading-[1.6] text-[var(--muted)]">{{ message() }}</p>
    @if (error(); as errorMessage) {
      <p class="mt-3 text-xs text-[var(--error)]" role="alert">{{ errorMessage }}</p>
    }
    <div class="mt-6 grid grid-cols-2 gap-2.5">
      <button class="rounded-lg border border-[var(--line)] bg-[var(--surface-soft)] px-5 py-3 text-xs font-semibold"
        type="button" autofocus [disabled]="busy()" (click)="cancelled.emit()">{{ t('cancel') }}</button>
      <button class="rounded-lg bg-[var(--uga-navy)] px-5 py-3 text-xs font-semibold text-[var(--uga-white)] shadow-[inset_0_-3px_0_var(--accent)]"
        type="button" [disabled]="busy()" (click)="confirmed.emit()">{{ t('confirm') }}</button>
    </div>
  </div>
</td-dialog>
